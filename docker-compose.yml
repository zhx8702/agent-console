  REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
  DRAW_STORAGE_DIR: ${COMPOSE_DRAW_STORAGE_DIR:-/data/draw}
  BUS_CONSUME_BATCH_SIZE: ${BUS_CONSUME_BATCH_SIZE:-16}
  BUS_CONSUME_BLOCK_MS: ${BUS_CONSUME_BLOCK_MS:-5000}
  BUS_MAX_ATTEMPTS: ${COMPOSE_BUS_MAX_ATTEMPTS:-5}
  BUS_RETRY_BASE_SECONDS: ${COMPOSE_BUS_RETRY_BASE_SECONDS:-1}
  BUS_RETRY_MAX_SECONDS: ${COMPOSE_BUS_RETRY_MAX_SECONDS:-30}
  BUS_PENDING_CLAIM_IDLE_MS: ${COMPOSE_BUS_PENDING_CLAIM_IDLE_MS:-300000}
  WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-15}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
  WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-20}
  WXBOT_API_TOKEN: ${COMPOSE_WXBOT_API_TOKEN:-}
  WXBOT_SDK_URL: ${COMPOSE_WXBOT_SDK_URL:-http://host.docker.internal:5080}
  WXBOT_DEFAULT_TENANT_ID: ${COMPOSE_WXBOT_DEFAULT_TENANT_ID:-default}
  WXBOT_BRIDGE_POLL_INTERVAL: ${COMPOSE_WXBOT_BRIDGE_POLL_INTERVAL:-3}
  WXBOT_BRIDGE_SEND_INTERVAL: ${COMPOSE_WXBOT_BRIDGE_SEND_INTERVAL:-2}
  WXBOT_GROUP_REPLY_COOLDOWN_SECONDS: ${COMPOSE_WXBOT_GROUP_REPLY_COOLDOWN_SECONDS:-1}
  WXBOT_GROUP_REPLY_COALESCE_WINDOW_MS: ${COMPOSE_WXBOT_GROUP_REPLY_COALESCE_WINDOW_MS:-250}
  WXBOT_GROUP_REPLY_ADAPTIVE_COOLDOWN_ENABLED: ${COMPOSE_WXBOT_GROUP_REPLY_ADAPTIVE_COOLDOWN_ENABLED:-true}
  WXBOT_GROUP_REPLY_BURST_WINDOW_SECONDS: ${COMPOSE_WXBOT_GROUP_REPLY_BURST_WINDOW_SECONDS:-10}
  WXBOT_GROUP_REPLY_ADAPTIVE_COOLDOWN_MAX_SECONDS: ${COMPOSE_WXBOT_GROUP_REPLY_ADAPTIVE_COOLDOWN_MAX_SECONDS:-8}
  WXBOT_PREVIEW_WAIT_SECONDS: ${COMPOSE_WXBOT_PREVIEW_WAIT_SECONDS:-30}
  WXBOT_PREVIEW_POLL_INTERVAL_SECONDS: ${COMPOSE_WXBOT_PREVIEW_POLL_INTERVAL_SECONDS:-0.7}
  WXBOT_MEDIA_BASE_URL: ${COMPOSE_WXBOT_MEDIA_BASE_URL:-}
  WXBOT_OUTBOUND_FILE_DIR: ${WXBOT_OUTBOUND_FILE_DIR:-/data/wxbot-outbound}
  WXBOT_OUTBOUND_FILE_MAX_BYTES: ${COMPOSE_WXBOT_OUTBOUND_FILE_MAX_BYTES:-10485760}
  WXBOT_OUTBOUND_FILE_RETENTION_SECONDS: ${COMPOSE_WXBOT_OUTBOUND_FILE_RETENTION_SECONDS:-604800}
  WXBOT_OUTBOUND_FILE_CLEANUP_GRACE_SECONDS: ${COMPOSE_WXBOT_OUTBOUND_FILE_CLEANUP_GRACE_SECONDS:-300}
  CHANNEL_CONNECTION_ID: ${COMPOSE_CHANNEL_CONNECTION_ID:-}
  CHANNEL_ALLOWED_SDK_ORIGINS: ${COMPOSE_CHANNEL_ALLOWED_SDK_ORIGINS:-}

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: ${COMPOSE_POSTGRES_USER:-cs}
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD:-compose_dev_postgres_password}
      POSTGRES_DB: ${COMPOSE_POSTGRES_DB:-cs}
    expose: ["5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPOSE_POSTGRES_USER:-cs} -d ${COMPOSE_POSTGRES_DB:-cs}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes"]
    expose: ["6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  qdrant:
    profiles: ["knowledge"]
    image: qdrant/qdrant:v1.12.1@sha256:d774e7bb65744454984c6021637a0da89271f30df15e48601a9fafc926d26b1f
    expose: ["6333", "6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0@sha256:923eb1cfae32fe09676cfd74762b2b237349f2273888529594f6c6ffe1fb3d7e
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otel/config.yaml:ro
    expose: ["4317", "4318"]

  migrate:
    profiles: ["app"]
    build: .
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    profiles: ["app"]
    build: .
    environment:
      <<: *app-env
      APP_PROCESS_ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: ["${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_API_PORT:-8000}:8000"]
    volumes:
      - configdata:/data/config
      - drawdata:/data/draw
      - amapdata:/data/amap
      - wxbotoutbound:${WXBOT_OUTBOUND_FILE_DIR:-/data/wxbot-outbound}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

  inbound-worker:
    profiles: ["app"]
    build: .
    environment:
      <<: *app-env
      # Empty falls back to container hostname + PID, which remains unique
      # when this service is horizontally scaled.
      APP_PROCESS_ROLE: inbound
      WORKER_INSTANCE_ID: ${INBOUND_WORKER_INSTANCE_ID:-}
      WORKER_METRICS_HOST: 0.0.0.0
      WORKER_METRICS_PORT: "9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - configdata:/data/config
      - drawdata:/data/draw
      - amapdata:/data/amap
      - wxbotoutbound:${WXBOT_OUTBOUND_FILE_DIR:-/data/wxbot-outbound}
    command: ["python", "-m", "app.workers.inbound_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "--role", "inbound"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

  outbound-worker:
    profiles: ["app"]
    build: .
    environment:
      <<: *app-env
      APP_PROCESS_ROLE: outbound
      WORKER_INSTANCE_ID: ${OUTBOUND_WORKER_INSTANCE_ID:-}
      WORKER_METRICS_HOST: 0.0.0.0
      WORKER_METRICS_PORT: "9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - configdata:/data/config
      - drawdata:/data/draw
    command: ["python", "-m", "app.workers.outbound_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "--role", "outbound"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

  scheduler:
    profiles: ["app"]
    build: .
    environment:
      <<: *app-env
      APP_PROCESS_ROLE: scheduler
      WORKER_INSTANCE_ID: ${SCHEDULER_INSTANCE_ID:-}
      WORKER_METRICS_HOST: 0.0.0.0
      WORKER_METRICS_PORT: "9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - configdata:/data/config
      - drawdata:/data/draw
      - amapdata:/data/amap
      - wxbotoutbound:${WXBOT_OUTBOUND_FILE_DIR:-/data/wxbot-outbound}
    command: ["python", "-m", "app.workers.scheduler_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "--role", "scheduler"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

  wxbot-bridge-worker:
    profiles: ["wxbot"]
    build: .
    environment:
      <<: *wxbot-adapter-env
      APP_PROCESS_ROLE: wxbot_bridge
      WORKER_INSTANCE_ID: ${WXBOT_BRIDGE_WORKER_INSTANCE_ID:-}
      WORKER_METRICS_HOST: 0.0.0.0
      WORKER_METRICS_PORT: "9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - drawdata:/data/draw
    command: ["python", "-m", "app.workers.wxbot_bridge_worker"]
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.workers.healthcheck
        - --role
        - wxbot_bridge
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_started
    ports: ["${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_FRONTEND_PORT:-4173}:8080"]

volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
  configdata: {}
  drawdata: {}
  amapdata: {}
  wxbotoutbound: {}
