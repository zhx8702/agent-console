# Optional development-only port publishing.
#
# The base Compose file keeps stateful services on the private Compose network.
# Add this file only when host-side database, Redis, Qdrant, or OTLP tooling is
# required. Every published port remains bound to loopback.
services:
  postgres:
    ports:
      - "127.0.0.1:${COMPOSE_DEV_POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${COMPOSE_DEV_REDIS_PORT:-6379}:6379"

  qdrant:
    ports:
      - "127.0.0.1:${COMPOSE_DEV_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${COMPOSE_DEV_QDRANT_GRPC_PORT:-6334}:6334"

  otel-collector:
    ports:
      - "127.0.0.1:${COMPOSE_DEV_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${COMPOSE_DEV_OTEL_HTTP_PORT:-4318}:4318"
