server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker can assign a new IP whenever the API container is recreated.
  # Resolve the service name at request time instead of caching its startup IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8000;

  location = /api {
    return 308 /api/;
  }

  location ^~ /api/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Agent-Console-Api-Prefix /api;
    proxy_cookie_path ~^/.* /api/;
  }

  # Compatibility for absolute support URLs emitted by FastAPI's generated
  # Swagger page. Agent Console application traffic stays under /api.
  location = /openapi.json {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs/oauth2-redirect {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
