# Single-host server overlay for the companion wx-bot deployment.
#
# The API, workers, and scheduler all call WXBOT_SDK_URL. Keep every process
# that can execute wxbot work attached to the SDK network; otherwise scheduled
# reports can be created successfully but fail while collecting messages.
#
# Message-export writers bind a common host outbox at the same absolute
# container path. The companion SDK deployment must mount this exact host
# directory at the same target and allow it in file_send_allowed_dirs.
services:
  postgres:
    restart: unless-stopped
    ports: !override ["127.0.0.1:5432:5432"]
  redis:
    restart: unless-stopped
    ports: !override ["127.0.0.1:6379:6379"]
  otel-collector:
    restart: unless-stopped
    ports: !override ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
  api:
    restart: unless-stopped
    ports: !override ["127.0.0.1:8000:8000"]
    networks: [default, wxbot-sdk]
    volumes:
      - type: bind
        source: ${WXBOT_OUTBOUND_FILE_HOST_DIR:-/opt/wxbot-shared/outbox}
        target: ${WXBOT_OUTBOUND_FILE_DIR:-/data/wxbot-outbound}
        bind:
          create_host_path: true
      - type: bind
        source: ${SPEAKER_PORTRAIT_HOST_DIR:-/opt/agent-console-portraits}
        target: ${SPEAKER_PORTRAIT_DATA_DIR:-/data/portraits}
        bind:
          create_host_path: true
  inbound-worker:
    restart: unless-stopped
    networks: [default, wxbot-sdk]
    volumes:
      - type: bind
        source: ${WXBOT_OUTBOUND_FILE_HOST_DIR:-/opt/wxbot-shared/outbox}
        target: ${WXBOT_OUTBOUND_FILE_DIR:-/data/wxbot-outbound}
        bind:
          create_host_path: true
  outbound-worker:
    restart: unless-stopped
    networks: [default, wxbot-sdk]
  scheduler:
    restart: unless-stopped
    networks: [default, wxbot-sdk]
    volumes:
      - type: bind
        source: ${WXBOT_OUTBOUND_FILE_HOST_DIR:-/opt/wxbot-shared/outbox}
        target: ${WXBOT_OUTBOUND_FILE_DIR:-/data/wxbot-outbound}
        bind:
          create_host_path: true
      - type: bind
        source: ${SPEAKER_PORTRAIT_HOST_DIR:-/opt/agent-console-portraits}
        target: ${SPEAKER_PORTRAIT_DATA_DIR:-/data/portraits}
        bind:
          create_host_path: true
  wxbot-bridge-worker:
    restart: unless-stopped
    networks: [default, wxbot-sdk]
  frontend:
    restart: unless-stopped
    ports: !override ["0.0.0.0:4173:8080"]
  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    ports: !override ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]

networks:
  wxbot-sdk:
    external: true
    name: ${COMPOSE_WXBOT_DOCKER_NETWORK:-wx-bot-linux-xfce_default}
