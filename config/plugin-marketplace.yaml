items:
  - name: amap
    display_name: 高德地图
    version: 0.1.0
    description: AMap personal map, POI search, and route planning agent tools
    author: builtin
    source: builtin
    package:
      type: builtin
      uri: plugins/amap
    capability_digest: sha256:d1613dac4d3149cad9adeb776455272f823c0445ac020a55f6504905954a56b9
    compatibility:
      core_api: ">=0.1.0 <0.2.0"
      python: ">=3.11"
    permissions:
      - id: network:amap
        level: external
        description: 访问高德地图 API
      - id: storage:plugin
        level: local
        description: 写入地图缓存和生成文件
      - id: agent_tools
        level: runtime
        description: 注册地图相关 Agent 工具
      - id: admin_api
        level: local
        description: 暴露插件管理接口
    capabilities:
      routes: ["/plugins/amap"]
      hooks: []
      agent_tools:
        - amap_around_search
        - amap_bus_info
        - amap_coordinate_convert
        - amap_create_personal_map
        - amap_distance
        - amap_district
        - amap_geo
        - amap_input_tips
        - amap_place_detail
        - amap_regeo
        - amap_route_plan
        - amap_static_map
        - amap_text_search
        - amap_traffic_status
        - amap_weather
      commands: []
    restart_policy: required_after_install

